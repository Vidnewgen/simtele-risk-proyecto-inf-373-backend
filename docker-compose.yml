services:
  postgres:
    image: postgres:17
    container_name: simtele-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simtele
    ports: [ "5433:5432" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d simtele" ]
      interval: 5s
      retries: 10
  adminer:
    image: adminer
    ports: [ "8080:8080" ]
    depends_on: [ postgres ]
volumes:
  pgdata:
